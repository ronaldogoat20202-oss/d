name: Windows launcher
on:
  workflow_dispatch:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      ORBIT_MICROSOFT_CLIENT_ID: ${{ vars.ORBIT_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified from upstream tag
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run dist:win
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Orbit-Launcher-Windows-x64
          path: release/Orbit-Launcher-*-Setup.exe
          if-no-files-found: error
